<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل ادمین — خانه لوازم</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header" class="site-header"></header>

<div class="admin-layout">
  <aside class="admin-side">
    <a href="admin.html" class="active">مدیریت محصولات</a>
  </aside>

  <main class="admin-main">
    <div class="admin-head">
      <h1 style="margin:0">محصولات</h1>
      <button class="btn primary" id="add-product-btn">+ افزودن محصول</button>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>#</th>
          <th>عنوان</th>
          <th>دسته</th>
          <th>قیمت</th>
          <th>وضعیت</th>
          <th>عملیات</th>
        </tr>
      </thead>
      <tbody id="admin-table-body"></tbody>
    </table>
  </main>
</div>

<!-- مودال افزودن/ویرایش محصول -->
<div class="modal-backdrop" id="product-modal">
  <div class="modal">
    <h2 id="modal-title">افزودن محصول</h2>
    <div class="form-error" id="modal-error"></div>
    <form id="product-form">
      <div class="field"><label>عنوان محصول</label><input id="p-title" required></div>
      <div class="field"><label>دسته‌بندی (slug مثل fridge, washer)</label><input id="p-category" required></div>
      <div class="field"><label>قیمت (تومان)</label><input id="p-price" type="number" required></div>
      <div class="field"><label>آدرس تصویر (اختیاری)</label><input id="p-image"></div>
      <div class="field"><label>توضیحات</label><textarea id="p-description"></textarea></div>
      <div class="field">
        <label><input type="checkbox" id="p-instock" style="width:auto;display:inline-block;margin-left:6px"> موجود در انبار</label>
      </div>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button type="submit" class="btn primary block">ذخیره</button>
        <button type="button" class="btn ghost block" id="close-modal-btn">انصراف</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
