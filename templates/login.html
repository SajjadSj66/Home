<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود — خانه لوازم</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header id="site-header" class="site-header"></header>

<div class="form-page">
  <div class="form-card">
    <span class="eyebrow">حساب کاربری</span>
    <h1>ورود به حساب</h1>

    <div class="form-error" id="auth-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">ایمیل</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">رمز عبور</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn primary block" id="auth-submit-btn">ورود</button>
    </form>

    <p class="form-note">حساب نداری؟ <a href="register.html" style="color:var(--primary)">ثبت‌نام کن</a></p>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="{% static 'js/config.js' %}"></script>
<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/store.js' %}"></script>
<script src="{% static 'js/layout.js' %}"></script>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
