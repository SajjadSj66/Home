<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبد خرید — خانه لوازم</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header" class="site-header"></header>

<main class="container">
  <h1 style="margin-top:32px">سبد خرید</h1>
  <div class="cart-layout">
    <div id="cart-list"></div>
    <div class="summary-card">
      <h2 style="font-size:1.05rem">خلاصه سفارش</h2>
      <div class="row"><span>جمع کالاها</span><span id="summary-subtotal">۰ تومان</span></div>
      <div class="row"><span>هزینه ارسال</span><span>پس از ثبت آدرس</span></div>
      <div class="row total"><span>مبلغ قابل پرداخت</span><span id="summary-total">۰ تومان</span></div>
      <button class="btn primary block" id="go-checkout-btn" style="margin-top:14px">ادامه‌ی خرید</button>
    </div>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
