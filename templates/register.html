<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت‌نام — خانه لوازم</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header" class="site-header"></header>

<div class="form-page">
  <div class="form-card">
    <span class="eyebrow">حساب کاربری</span>
    <h1>ساخت حساب جدید</h1>

    <div class="form-error" id="auth-error"></div>

    <form id="register-form">
      <div class="field">
        <label for="full_name">نام و نام خانوادگی</label>
        <input type="text" id="full_name" required>
      </div>
      <div class="field">
        <label for="email">ایمیل</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">رمز عبور</label>
        <input type="password" id="password" required minlength="6">
      </div>
      <div class="field">
        <label for="password2">تکرار رمز عبور</label>
        <input type="password" id="password2" required minlength="6">
      </div>
      <button type="submit" class="btn primary block" id="auth-submit-btn">ثبت‌نام</button>
    </form>

    <p class="form-note">حساب داری؟ <a href="login.html" style="color:var(--primary)">وارد شو</a></p>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth-forms.js"></script>
</body>
</html>
